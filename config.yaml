# 企业内网地址；末尾的 /job/.../job/ 代表“新分支 Job 的父级”。
github:
  plugin_url: "https://alm-github.systems.uk.hsbc/mobile/paybybank-ios-plugin"
  gmx_url: "https://alm-github.systems.uk.hsbc/mobile/mobilebanking-global-ios"
  token_env: "GITHUB_TOKEN"

jenkins:
  # 公司环境推荐 chrome（由 IT 安装）；或 chromium（需内部下载镜像）
  browser_channel: "chrome"
  # 只允许向以下经过核准的 HTTPS 登录域名填写 Keychain 凭据；外部 SSO 请先核实再加。
  auth_allowed_hosts:
    - "*.hsbc"
  plugin_parent: "https://mobile-premier01-jenkins.build-mobile.iwpb.euw2.prod.aws.cloud.hsbc/job/IWPB_Transaction_Banking/job/Domestic_Payment_and_Transfer_Mobile_GB_12579065/job/Lib/job/mobile_paybybank-ios-plugin/job/release-build/job/"
  gmx_parent: "https://mobile-platform-jenkins.build-mobile.iwpb.euw2.prod.aws.cloud.hsbc/job/mobilex-global-uploads/job/global-ios-upload/job/"
  discover_timeout_minutes: 30
  # 等待新分支 Jenkins Job 时每 10 秒重试（404 在 Job 创建前通常正常）。
  discover_poll_seconds: 10
  build_timeout_minutes: 180
  callback_timeout_minutes: 30
  poll_seconds: 45
  # 最新 Build 的原始 consoleText 轮询，不依赖 Chrome DOM 渲染。
  result_poll_seconds: 5
  # Console 打开后额外等待最终 Finished 行，避免 DOMContentLoaded 过早切走。
  console_settle_seconds: 10
  # GMX Build with Parameters 的可编辑默认值：网页自动读入。
  gmx_defaults:
    BUILD_TYPE: "Develop"
    SIGNING_REPO_BRANCH: "master"
    SYNC_UPLOAD: true  # 业务要求；Jenkins 原生默认未勾选，工具会显式勾选
    SKIP_TEST: true     # 截图中 GMX 默认已勾选
    FORCE: true         # 截图中 GMX 默认已勾选
    KEEP_ALIVE: false   # 截图中 GMX 默认未勾选
    CUSTOM_FOLDER: ""  # 留空按 0_A_<country>_<project> 自动生成
  # 自定义 Jenkins 字段选择器（只有自动定位失败时才需要填写）
  gmx_fields:
    ENTITIES: ""
    SYNC_UPLOAD: ""
    CUSTOM_FOLDER: ""
    BUILD_TYPE: ""
    SIGNING_REPO_BRANCH: ""
    SKIP_TEST: ""
    FORCE: ""
    KEEP_ALIVE: ""

build:
  # 可选工单编号；无编号时生成 AUTO-时间戳。页面和 CLI 输入优先。
  gmx_issue_key: ""
  max_parallel: 10
  timezone: "local"
  # 202610100030: 分钟精度。并发同一分钟提交，管理器会分配不同的时间戳。
  max_changed_lines: 100
  # 内网 Jenkins Stage 名称、成功文案若和此处不同，以联调为准。
  upload_success_pattern: ""

# 构建成功后回写 Jira（已启用；dry_run=true 时只演练，不改任何 ticket）。
# 确认 state.json 里的 jira_report 无误后，把 dry_run 改为 false 才会真正写入。
# 认证只读环境变量：JIRA_TOKEN（Bearer PAT），或 JIRA_USER + JIRA_API_TOKEN。
jira:
  enabled: true
  dry_run: true
  base_url: "https://wpb-jira.systems.uk.hsbc"
  flavor: "server"          # server=按用户名指派；cloud=按 accountId 指派
  key_pattern: '\b[A-Z][A-Z0-9]{1,9}-\d{1,7}\b'
  transition_name: "In Test"
  assign_to_reporter: true
  first_run_commits: 0      # 0=首次只记录基线；>0=首次回溯最近 N 个提交
  max_tickets_per_run: 40
  use_pr_lookup: true       # 以 PR（标题/分支/描述）为主要来源找 Jira 号；查询失败自动退回提交信息

# 离线本地模型（llama.cpp GGUF）。不联网、不调用任何外部 API。
# 只做两件事：一个提交写了多个 Jira 号时选主要的一个；把提交改写成给测试看的短说明。
# 模型文件不存在或没装 llama-cpp-python 时自动降级为纯规则。
ai:
  enabled: false
  model_path: ""            # 例如 ~/models/qwen2.5-7b-instruct-q4_k_m.gguf （由公司批准的渠道提供）
  n_ctx: 4096
  n_gpu_layers: -1          # Apple Silicon 使用 Metal；-1=尽量全部放 GPU
